<!DOCTYPE html>
<html lang="zh-CN" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Video clip | Mediabunny</title>
		<script type="module" src="../base.ts"></script>
		<script type="module" src="./demo.ts"></script>
		<link rel="stylesheet" href="../base.css" />
		<link rel="icon" href="../../docs/public/mediabunny-logo.svg" />
	</head>
	<body
		class="flex flex-col items-center py-10 bg-zinc-50 text-zinc-800 dark:bg-zinc-900 dark:text-zinc-200 px-2 h-svh"
	>
		<h1 class="text-3xl font-bold text-purple-500 text-center">
			Video clip demo
		</h1>
		<p class="max-w-lg text-center">基于 VideoClip 组件的最小可运行示例。</p>

		<div class="flex flex-col items-center gap-2 mt-4">
			<div class="flex gap-2 items-center">
				<input
					id="file-input"
					type="file"
					accept="video/*,audio/*"
					class="rounded-lg bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 text-sm"
				/>

				<button
					id="load-mp4"
					class="rounded-lg bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 text-sm"
				>
					Load MP4
				</button>
				<button
					id="load-mp3"
					class="rounded-lg bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 text-sm"
				>
					Load MP3
				</button>
			</div>
			<div class="flex gap-2">
				<button
					id="play"
					class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-4 py-2"
				>
					Play
				</button>
				<button
					id="pause"
					class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-4 py-2"
				>
					Pause
				</button>
			</div>
			<!-- Progress bar -->
			<div class="flex items-center gap-2 w-full max-w-5xl">
				<input
					id="progress"
					type="range"
					min="0"
					max="100"
					step="0.001"
					class="w-full"
				/>
			</div>
			<div class="flex gap-2 items-center">
				<input
					id="seek-seconds"
					type="number"
					step="0.001"
					placeholder="seconds"
					class="rounded bg-zinc-200 dark:bg-zinc-750 px-2 py-1 w-32"
				/>
				<button
					id="seek"
					class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-4 py-2"
				>
					Seek
				</button>
			</div>
			<p id="status" class="text-xs opacity-70"></p>
			<p id="time" class="text-xs opacity-70"></p>
		</div>

		<div
			id="player"
			class="flex justify-center align-center relative rounded-xl shrink min-h-14 min-w-0 w-full max-w-5xl overflow-hidden select-none mt-6"
			style="display: none"
		>
			<canvas
				class="w-160 border-2 border-amber-400"
				width="1280"
				height="1280"
			></canvas>
			<div
				id="loading"
				class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-amber-950/50 text-white px-4 py-2 rounded-md"
				style="display: none"
			>
				Loading...
			</div>
		</div>

		<a href="/" class="fixed top-0 left-0 flex gap-2 py-2 px-5 items-center">
			<img src="../../docs/public/mediabunny-logo.svg" class="size-6" />
			<p class="text-sm font-medium">Mediabunny</p>
		</a>

		<a
			href="https://github.com/Vanilagy/mediabunny/tree/main/examples/video-clip"
			target="_blank"
			class="flex items-center gap-2 fixed top-0 right-0 py-2 px-5 bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 rounded-bl-xl"
		>
			<img src="../../docs/assets/github-mark.svg" class="size-6 dark:invert" />
			<p>View source code</p>
		</a>
	</body>
</html>
